parameters:
    wexample_ds_app_home_route: ~

    wexample_symfony_design_system.loader.layout_bases:
        modal:
            page_manager_component: '@@WexampleSymfonyDesignSystemBundle/components/modal'
        panel:
            page_manager_component: '@@WexampleSymfonyDesignSystemBundle/components/panel'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Wexample\SymfonyDesignSystem\Controller\:
        resource: '../../Controller/'
        exclude: '../../Controller/**/Abstract*.php'

    Wexample\SymfonyDesignSystem\Chat\SlashCommand\SlashCommandRegistry:
        arguments:
            $commands: !tagged_iterator wexample.symfony_design_system.slash_command

    Wexample\SymfonyDesignSystem\Command\:
        resource: '../../Command/'

    Wexample\SymfonyDesignSystem\Service\:
        resource: '../../Service/'

    Wexample\SymfonyDesignSystem\Service\RouteGroupRegistry:
        arguments:
            $voters: !tagged_iterator wexample.symfony_design_system.route_group_voter

    Wexample\SymfonyDesignSystem\Service\ElementScannerService:
        arguments:
            $sources: '%wexample_symfony_design_system.element_sources%'

    Wexample\SymfonyDesignSystem\Twig\:
        resource: '../../Twig/'
        exclude: '../../Twig/AppExtension.php'

    # The fragment handler has no autowiring alias in FrameworkBundle, so the
    # one service needing it names it. The rest is autowired as usual.
    Wexample\SymfonyDesignSystem\Twig\SectionExtension:
        arguments:
            $fragmentHandler: '@fragment.handler'

    Wexample\SymfonyDesignSystem\Twig\AppExtension:
        arguments:
            $appHomeRoute: '%wexample_ds_app_home_route%'
        tags: ['twig.extension']

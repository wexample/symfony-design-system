<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e2e2" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#f5f5f5"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Centered image icon -->
  <g transform="translate(400, 225)">
    <!-- Frame -->
    <rect x="-52" y="-42" width="104" height="84" rx="6" fill="none" stroke="#c0c0c0" stroke-width="2.5"/>
    <!-- Sun -->
    <circle cx="-22" cy="-16" r="12" fill="#d0d0d0"/>
    <!-- Mountains -->
    <polygon points="-52,42 -14,-4 24,42" fill="#d0d0d0"/>
    <polygon points="-4,42 26,8 52,42" fill="#c4c4c4"/>
    <!-- Clip mountains to frame -->
  </g>

  <!-- Label -->
  <text
    x="400" y="310"
    text-anchor="middle"
    font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace"
    font-size="13"
    fill="#aaa"
    letter-spacing="0.05em"
  >800 × 450</text>
</svg>

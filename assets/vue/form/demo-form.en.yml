field:
  password:
    label: Password
    help: Enter your password to authenticate.
    error:
      ERR_FIELD_PASSWORD_INVALID: Password is invalid for test purpose.
  emoji:
    label: Emoji
    help: Pick an emoji to represent your mood.
    error:
      ERR_FIELD_EMOJI_INVALID: Emoji is invalid for test purpose.
  text_simple:
    label: Text
    help: A single-line text input for short content.
    error:
      ERR_FIELD_TEXT_SIMPLE_INVALID: Text is invalid for test purpose.
  text_area:
    label: Long text
    placeholder: Type whatever you want...
    help: A multi-line text area for longer content.
    error:
      ERR_FIELD_TEXT_AREA_INVALID: Long text is invalid for test purpose.
  number:
    label: Number
    help: Enter a numeric value.
    error:
      ERR_FIELD_NUMBER_INVALID: Number is invalid for test purpose.
  email:
    label: Email
    placeholder: you@example.com
    help: Enter a valid email address.
    error:
      ERR_FIELD_EMAIL_INVALID: Email is invalid for test purpose.
  url:
    label: URL
    placeholder: https://
    help: Enter a full URL including the protocol.
    error:
      ERR_FIELD_URL_INVALID: URL is invalid for test purpose.
  date:
    label: Date
    help: Select a date using the date picker.
    error:
      ERR_FIELD_DATE_INVALID: Date is invalid for test purpose.
  datetime:
    label: Date & time
    help: Select a date and time combined.
    error:
      ERR_FIELD_DATETIME_INVALID: Date & time is invalid for test purpose.
  time:
    label: Time
    help: Select a time of day.
    error:
      ERR_FIELD_TIME_INVALID: Time is invalid for test purpose.
  file:
    label: File
    help: Upload one or more files from your device.
    error:
      ERR_FIELD_FILE_INVALID: File is invalid for test purpose.
  radio_choice:
    label: Radio choice
    help: Select one option from the list.
    error:
      ERR_FIELD_RADIO_CHOICE_INVALID: Radio choice is invalid for test purpose.
    choice:
      option_a:
        label: Option A
      option_b:
        label: Option B
      option_c:
        label: Option C
  switch:
    label: Switch
    help: Toggle this option on or off.
    error:
      ERR_FIELD_SWITCH_INVALID: Switch is invalid for test purpose.

form:
  error:
    ERR_FORM_TEST: Global error for test purpose.

action:
  button_demo: Do nothing
  submit_default: Submit
  submit_error: Show errors
  submit_js: JS action
  submit_redirect: Redirect

toast:
  success:
    title: Success
    message: Form submitted successfully.
  js_action:
    title: JS action
    message: Do you want to reactivate the form?
    reactivate: Reactivate
    dismiss: Dismiss

description: |
  Use this form to test submit behaviors. This demo is in a Vue component.

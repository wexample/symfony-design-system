    title: Basic blocks
  advanced:
    title: Advanced blocks
  aside:
    title: Fixed aside column
    description: A narrow column sized on the --size scale, next to a body that absorbs the remaining width.
  card:
    title: Cards
  figure:
    title: Figures
    description: A single oversized value or icon, centered. Used for dashboard counters and status tiles — add block--square to keep the tile square whatever its width.
  stacks:
    title: Stacks

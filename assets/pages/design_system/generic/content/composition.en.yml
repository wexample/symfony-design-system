article:
  toc:
    label: "In this article"
  title: "Understanding design tokens"
  intro: "Design tokens are the single source of truth for visual decisions across a product. They encode color, spacing, typography, and motion into named variables that components consume."
  section_one:
    title: "Why tokens matter"
    body_one: "Without tokens, a change to the primary brand color requires hunting through hundreds of files. With tokens, one variable update propagates everywhere — from buttons to alerts to navigation bars."
    body_two: "Tokens also bridge the gap between design tools and code. A designer names a color <strong>surface-brand</strong> in Figma; a developer uses <code>var(--surface-brand)</code> in CSS. They speak the same language."
  section_two:
    title: "Practical examples"
    body: "Consider a component that needs a background, a border, and text. Instead of hardcoding <code>#1a56db</code>, <code>#e1effe</code>, and <code>#1e429f</code>, the component references <code>--color-primary</code>, <code>--surface-primary-subtle</code>, and <code>--text-primary-strong</code>. When the brand evolves, the palette changes — the component does not."
  list_title: "Token categories"
  list:
    - "Color — brand, semantic, and neutral palettes"
    - "Spacing — a consistent scale from 2px to 64px"
    - "Typography — font sizes, weights, and line heights"
    - "Radius — from sharp corners to fully rounded"
    - "Shadow — elevation levels for depth and hierarchy"
    - "Motion — easing curves and duration steps"
  quote: "Most of the quotes found on the Internet were probably generated by an AI."
  quote_author: "Albert Einstein"
  cta: "Read the full token reference"

media:
  alt: "Placeholder image alongside text"
  caption: "Image occupying one third of the layout."
  body_one: "Use content--media to place an image and text side by side. The image takes one third of the width, the text two thirds."
  body_two: "This layout suits pull quotes, illustrated definitions, or any short editorial block where the image reinforces the copy without dominating it."


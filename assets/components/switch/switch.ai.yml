# What an agent is told about a switch; `switch.ts` runs the actions.
# In english, never translated: see AgentContractService.
type: switch
description: A switch, on or off.
actions:
  get:
    description: Tells whether the switch is on.
    annotations:
      readOnlyHint: true
  set:
    description: "Turns the switch on or off. A switch may ask the user to confirm before turning on: `switched` is false when they refused."
    input_schema:
      properties:
        checked:
          type: boolean
      required: [checked]
    annotations:
      idempotentHint: true
  toggle:
    description: Turns the switch to the other state, as a click does.

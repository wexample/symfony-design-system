# Declares `block-list` to the design system registry.
# Kept by hand.
# formats, per format — whose move it is next:
#   true            it is there, nothing is owed
#   todo — a note   it is wanted and missing, someone should build it
#   a sentence      it does without on purpose, and this is why
#   left out        nobody has ruled yet, and the check will name it
description: "An ordered list of things edited one by one: each a line folded on its body, moved up and down, taken off, more added under it — the caller's api answering each."
formats:
  style: true
  vue: true
  template: "it is edited, and editing is the client's: a page drawn on the server folds its items in disclosures"
  script: "its vue is the whole of it"
  schema: todo
  ai: "todo — add, move, remove an item"
  react: todo
  flutter: todo

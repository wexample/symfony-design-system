  template: "the twig theme mounts the vue beside its field: the versions are read in the browser, at the record's address"
  script: "its behaviour is the vue component's"
  schema: "an option of the text fields' schemas (versionsUrl), not a field of its own"
  ai: "todo — read the versions, take one back"

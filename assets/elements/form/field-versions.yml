description: "The earlier versions of a text field (`versionsUrl` of a textarea or a code), a bar under it as a property tied to it: the version read — the draft first, alone while there is no earlier one —, its diff with the draft (diff-text), « take this version back » making it the draft without saving. The draft kept aside while a version is read. The same bar under the twig theme's field and under dynamic-form's."
formats:

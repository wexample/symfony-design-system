description: "A field extension (`extensions.versions` of any kind of field, `extension_versions.schema.json`): the earlier versions of what the field holds, read at an address, drawn as the field's footer — the version read, the draft first and alone while there is no earlier one; its diff with the draft (diff-text); « take this version back » making it the draft without saving. The draft kept aside while a version is read. On every kind of field. The same footer under the twig theme's field and under the vue field, drawn by the field's base."

field:
  password:
    label: Password
    error:
      ERR_FIELD_PASSWORD_INVALID: Password is invalid for test purpose.
  emoji:
    label: Emoji
    error:
      ERR_FIELD_EMOJI_INVALID: Emoji is invalid for test purpose.
  text_simple:
    label: Text
    error:
      ERR_FIELD_TEXT_SIMPLE_INVALID: Text is invalid for test purpose.
  text_area:
    label: Long text
    placeholder: Type whatever you want...
    error:
      ERR_FIELD_TEXT_AREA_INVALID: Long text is invalid for test purpose.
  behavior:
    label: Behavior
    error:
      ERR_FIELD_BEHAVIOR_INVALID: Behavior selection is invalid for test purpose.
    choice:
      error:
        label: Show errors
        description: closes the embed (or does nothing in-page).
      js:
        label: JS action (toast)
        description: returns validation errors.
      redirect:
        label: Redirect
        description: triggers a toast without submitting.
      default:
        label: Default
        description: navigates the full page, or close the modal.
      embed_stay:
        label: Keep embed open (modal / panel)
        description: stays open in modal/panel.
      embed_redirect:
        label: Redirect in embed (modal / panel)
        description: navigates inside the modal/panel.

  date:
    label: Date
    error:
      ERR_FIELD_DATE_INVALID: Date is invalid for test purpose.
  datetime:
    label: Date & time
    error:
      ERR_FIELD_DATETIME_INVALID: Date & time is invalid for test purpose.
  time:
    label: Time
    error:
      ERR_FIELD_TIME_INVALID: Time is invalid for test purpose.
  file:
    label: File
    error:
      ERR_FIELD_FILE_INVALID: File is invalid for test purpose.
  email:
    label: Email
    placeholder: you@example.com
    error:
      ERR_FIELD_EMAIL_INVALID: Email is invalid for test purpose.
  number:
    label: Number
    error:
      ERR_FIELD_NUMBER_INVALID: Number is invalid for test purpose.
  url:
    label: URL
    placeholder: https://
    error:
      ERR_FIELD_URL_INVALID: URL is invalid for test purpose.
  switch:
    label: Switch
    error:
      ERR_FIELD_SWITCH_INVALID: Switch is invalid for test purpose.
  radio_choice:
    label: Radio choice
    error:
      ERR_FIELD_RADIO_CHOICE_INVALID: Radio choice is invalid for test purpose.
    choice:
      option_a:
        label: Option A
      option_b:
        label: Option B
      option_c:
        label: Option C

action:
  submit: Submit

error:
  ERR_FORM_TEST:
    message: Global error for test purpose.

description: |
  Use this form to test submit behaviors. This demo is available in page, ajax, and modal contexts. Pick a behavior below and submit:

toast:
  success:
    title: Success
    message: Form submitted successfully.
  js_action:
    title: JS action
    message: Do you want to reactivate the form?
    reactivate: Reactivate
    dismiss: Dismiss
